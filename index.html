<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>my pace — ランニング</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700;750&family=Noto+Sans+JP:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/vendor/leaflet.css">
  <link rel="stylesheet" href="/lib/map.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/lib/theme.css">
  <link rel="stylesheet" href="/lib/running.css">
  <link rel="stylesheet" href="/lib/surfaces.css">
  <link rel="stylesheet" href="/lib/workspace.css">
  <link rel="stylesheet" href="/lib/run-slots.css">
  <link rel="stylesheet" href="/lib/weather-view.css">
  <link rel="stylesheet" href="/lib/run-analysis.css">
  <link rel="stylesheet" href="/lib/laptop.css">
  <link rel="stylesheet" href="/lib/navigation.css">
  <link rel="stylesheet" href="/lib/running-motion.css">
  <script src="/assets/vendor/leaflet.js" defer></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#context">操作パネルへ移動</a>
  <header id="header" class="header"></header>
  <main id="workspace" class="workspace with-sidebar history">
    <section id="category-page" hidden tabindex="-1" aria-labelledby="category-title"></section>
    <aside class="sidebar">
      <div class="sidebar-toolbar">
        <h1 id="records-heading" class="records-heading">記録</h1>
        <button id="running-sync" class="running-sync" data-action="running-sync" aria-haspopup="dialog" hidden></button>
        <button class="diary-trigger" data-action="diary" aria-haspopup="dialog">今日の日記</button>
      </div>
      <section id="context" class="context" tabindex="0" aria-labelledby="records-heading"></section>
    </aside>
    <section class="map-stage" aria-label="ランニングマップ">
      <div id="map" class="map"></div>
      <div id="map-top" class="map-top"></div>
      <div id="map-bottom" class="map-bottom"></div>
    </section>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="save-warning" class="save-warning" role="alert" hidden></div>
</body>
</html>
